name: Build PrismLauncher DEB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Ermöglicht das manuelle Starten des Workflows über die GitHub-Oberfläche
  workflow_dispatch:
    inputs:
      branch:
        description: 'PrismLauncher Branch to build'
        required: false
        default: 'release-10.x'

jobs:
  build:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create output directory
        run: mkdir -p dist
        
      - name: Build PrismLauncher DEB via Docker
        # Führt den Build-Prozess analog zu deinem bereitgestellten Bash-Skript aus.
        # Exportiert das Ergebnis aus dem "scratch"-Image in den lokalen "dist"-Ordner.
        run: |
          docker buildx build \
            -f Dockerfile \
            --target artifact \
            --output "type=local,dest=dist" \
            --build-arg "REPO_URL=https://github.com/PrismLauncher/PrismLauncher.git" \
            --build-arg "BRANCH=${{ github.event.inputs.branch || 'release-10.x' }}" \
            --build-arg "PKG_NAME=prismlauncher" \
            --build-arg "PKG_VERSION=auto" \
            --build-arg "MAINTAINER=Local Build <root@localhost>" \
            --build-arg "ENABLE_LTO=OFF" \
            .

      - name: Check generated output
        run: ls -lh dist/*.deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-debian-package
          path: dist/*.deb
          if-no-files-found: error
