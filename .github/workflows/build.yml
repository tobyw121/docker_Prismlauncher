name: Build PrismaLauncher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      # 1. Lädt dein Repository herunter (wo dein Dockerfile und Skript liegen)
      - name: Checkout your repository
        uses: actions/checkout@v4

      # 2. Lädt den Quellcode des PrismLaunchers herunter
      - name: Checkout PrismLauncher source
        uses: actions/checkout@v4
        with:
          repository: 'PrismLauncher/PrismLauncher'
          path: 'src' # Speichert den Code im Ordner "src"
          submodules: 'recursive'

      # 3. Baut die "Fabrik" (das Docker Image)
      - name: Build Docker Image
        run: docker build -t prismlauncher-builder -f Dockerfile .

      # 4. Startet den Build-Prozess
      # Wir reichen den "src" Ordner (Quellcode) und einen "out" Ordner (für das Ergebnis) in den Container
      - name: Build the .deb package
        run: |
          mkdir -p out
          docker run --rm -v ${{ github.workspace }}/src:/src -v ${{ github.workspace }}/out:/out prismlauncher-builder

      # 5. Lädt das fertige Paket als Download hoch
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-debian-package
          path: ./out/*.deb
          if-no-files-found: error
