name: Build PrismaLauncher

# Wann soll der Workflow starten?
on:
  push:
    branches: [ "main" ] # Startet automatisch bei Pushes in den 'main' Branch
  workflow_dispatch:     # Erlaubt dir, den Workflow manuell über den Tab "Actions" zu starten

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      # 1. Lädt deine Dateien (Dockerfile & Skript) aus dem Repo herunter
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Baut das Docker-Image genau wie auf deinem lokalen PC
      - name: Build Docker Image
        run: docker build -t prismlauncher-builder .

      # 3. Extrahiert die gebauten Pakete aus dem fertigen Image
      - name: Extract .deb packages
        run: |
          mkdir -p output
          # Wir erstellen kurz einen Container aus dem Image, ohne ihn zu starten
          docker create --name temp-container prismlauncher-builder
          # Wir kopieren den Ordner mit den fertigen Dateien aus dem Container heraus
          docker cp temp-container:/home/appuser/prismlauncher ./output/
          # Den temporären Container wieder löschen
          docker rm temp-container

      # 4. Lädt die fertigen .deb Dateien als Artifact hoch, damit du sie herunterladen kannst
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-debian-package
          # Wir suchen im kopierten Ordner gezielt nach .deb Dateien
          path: ./output/prismlauncher/*.deb
          if-no-files-found: error
